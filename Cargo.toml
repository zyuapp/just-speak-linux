[package]
name = "just-speak"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Offline push-to-talk dictation for Omarchy and Hyprland"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"
hound = "3.5.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "=1.13.7"
tempfile = "3"
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
